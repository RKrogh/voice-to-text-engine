name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Package smoke test
        run: |
          VERSION="0.0.0-ci.${{ github.run_number }}"
          dotnet pack --no-build --configuration Release --output ./nupkgs -p:Version=$VERSION
          dotnet restore tests/PackageSmoke -p:SmokeVersion=$VERSION --source ./nupkgs --source https://api.nuget.org/v3/index.json
          dotnet run --project tests/PackageSmoke --no-restore -p:SmokeVersion=$VERSION

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # The tag is the version (v0.1.2 packs 0.1.2), so a tag and the packages cannot disagree.
      - name: Pack
        run: dotnet pack --configuration Release --output ./nupkgs -p:Version=${GITHUB_REF_NAME#v}

      - name: Package smoke test
        run: |
          dotnet restore tests/PackageSmoke -p:SmokeVersion=${GITHUB_REF_NAME#v} --source ./nupkgs --source https://api.nuget.org/v3/index.json
          dotnet run --project tests/PackageSmoke --no-restore -p:SmokeVersion=${GITHUB_REF_NAME#v}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./nupkgs/*.snupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
